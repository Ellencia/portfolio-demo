<title>형광펜 손맛 비교</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="demo.css">
<style>
/* 2단계 비교(FX_DESIGN.md): 하네스 A 4장면의 통화 글 카드만 떼어, 형광펜 방식 하나에 장면 하나. 줄·형광펜 순서와 간격은 원래대로, 앞 대기만 줄임 */
:root { --paper: #EDE5D1; --stock: #F7F1E2 }
.cap { word-break: keep-all }
.talk { padding: 9px 12px; font-size: 11.5px; line-height: 1.5 }
.talk h4 { margin: 0 0 3px; font-size: 10.5px; color: var(--sub); font-weight: 500 }
.talk div { display: grid; grid-template-columns: 44px 1fr; padding: 1px 0 }
.talk .sp { font-size: 10px; color: var(--sub); padding-top: 1px }
.why { margin: 0; font-size: 12px; line-height: 1.55; color: var(--sub) }
.why b { color: var(--ink) }
.cap mark.rn { background: none; animation: none }   /* 손 밑칠 장면: CSS 밑칠 끔 */
.on .cap mark[style] { animation-delay: var(--d) }   /* 비교용: CSS 장면도 제목 셋을 손 밑칠과 같은 간격으로 */
</style>

<div class="phone" id="phone">
<div class="stage" id="stage" data-hold="1500">
  <div class="bars" id="bars"></div>
</div>
</div>

<div class="controls">
  <button id="prev" type="button">이전</button>
  <button id="play" type="button">일시정지</button>
  <button id="next" type="button">다음</button>
  <button id="rec" type="button">녹화 화면</button>
  <div class="chips" id="chips"></div>
</div>
<p class="hint">장면 1–4는 본문 형광펜 붓 결 비교 넷, 5–7은 제목 밑칠 방식 셋입니다. 번호를 눌러 방식별로 다시 볼 수 있습니다.</p>

<script src="vendor/rough-notation-0.5.1.min.js"></script>
<script src="demo-fx.js"></script>
<script>
// [이름, 설명, Rough Notation 설정 | 설정 목록 | h(글자 높이) => 설정 목록]. 이전 비교(CSS·손 형광펜·밑줄)에서 3번 "순하게" 채택 → 지금은 끝 모양 비교
const SOFT = { type: 'highlight', iterations: 1, soft: true };
const LEN = [1, .95, .99, .9, .97, .93];   // 가닥 길이: 끝이 갈라지게
const V = [
  ['끝 사선', '굵은 선 한 줄, 끝을 <b>형광펜 촉처럼 비스듬히</b>. 지난번 3번.', { ...SOFT, cap: 'slant' }],
  ['끝 사선 · 마른 붓', '1번에 <b>가로 결</b>을 뚫음. 칠 안이 군데군데 비고 가장자리가 거칠어짐.', { ...SOFT, cap: 'slant', dry: true }],
  ['붓 가닥 여섯', '가는 선 <b>여섯 가닥</b>을 겹쳐 그음. 가닥 길이가 달라 오른쪽 끝이 갈라짐.', h => LEN.map((len, k) => ({ type: 'underline', iterations: 1, strokeWidth: h * .19, padding: h * (.12 + k * .152) - h, len, color: '#FFD84AD8' }))],
  ['붓 가닥 여섯 · 마른 붓', '3번에 <b>가로 결</b>까지.', h => LEN.map((len, k) => ({ type: 'underline', iterations: 1, strokeWidth: h * .19, padding: h * (.12 + k * .152) - h, len, color: '#FFD84AD8', dry: true }))],
];
// [말한 사람, 앞, 칠할 말, 뒤, 칠하는 시각(초)] — 원래 8.6 · 9 · 11 · 11.4초를 앞으로 당김
const L = [['OO상사', '', '납품일을 11/5로', ' 미뤄야 할 것 같아요.', 2.2], ['나', '확인하고 ', '오늘 중으로 회신', '드릴게요.', 2.6],
           ['OO상사', '', '앵커 볼트도 추가 견적', ' 부탁드려요.', 4.6], ['나', '네, ', '11/1까지', ' 보내드릴게요.', 5]];
V.forEach(([name, why, cfg]) => document.getElementById('stage').insertAdjacentHTML('beforeend', `<section class="scene">
  <div class="eyebrow"><span>형광펜 비교</span><span>${name}</span></div>
  <h2 class="cap">전화를 끊으면<br><mark>할 일이 먼저 와 있어요</mark></h2>
  <div class="card talk in" style="--d:.2s"><h4>통화 내용 · 글로 바꿈</h4>
    ${L.map(([sp, a, h, b, t], k) => `<div class="pop" style="--d:${(.5 + k * .3).toFixed(1)}s"><span class="sp">${sp}</span><span>${a}<span class="${cfg ? 'rn' : 'hl'}" style="--d:${t}s">${h}</span>${b}</span></div>`).join('')}
  </div>
  <p class="why">${why}</p>
  <div class="foot"><span>예시 데이터</span><span class="pg"></span></div>
</section>`));
document.querySelectorAll('.scene').forEach((s, i) => V[i][2] && s.querySelectorAll('.rn').forEach(e => {
  const c = V[i][2], h = e.getClientRects()[0].height;
  [].concat(typeof c === 'function' ? c(h) : c).forEach(c => demoFx.rough(e, parseFloat(e.style.getPropertyValue('--d')), c));
}));

// 제목 밑칠: [이름, 설명, 설정(h = 칠할 글자 상자 높이) | null]. 하네스 A 제목 셋(보통 · 긴 것 · 짧은 것)을 한 장면에
const TV = [
  ['제목 · 지금 (CSS)', '제목 글자 <b>아래 42%</b>를 곧게 쓸어 칠함. 지금 모든 데모.', null],
  ['제목 · 손 형광펜 순하게', '본문에 고른 방식 그대로, 글자 <b>높이 전체</b>.', h => ({ type: 'highlight', iterations: 1, soft: true })],
  ['제목 · 손 밑칠 아래쪽', '지금처럼 <b>아래 42%</b>만, 삐뚤게 한 번.', h => ({ type: 'underline', iterations: 1, strokeWidth: h * .42, padding: -h * .21 })],
];
const CAPS = [['전화를 끊으면', '할 일이 먼저 와 있어요'], ['견적 메일이 오면', '폴더엔 이미 들어가 있어요'], ['넣기 한 번', '그리고 퇴근']];
TV.forEach(([name, why, cfg]) => {
  document.getElementById('stage').insertAdjacentHTML('beforeend', `<section class="scene">
  <div class="eyebrow"><span>형광펜 비교</span><span>${name}</span></div>
  ${CAPS.map(([a, b], k) => `<h2 class="cap">${a}<br><mark${cfg ? ' class="rn"' : ''} style="--d:${.5 + k * .8}s">${b}</mark></h2>`).join('')}
  <p class="why">${why}</p>
  <div class="foot"><span>예시</span><span class="pg"></span></div>
</section>`);
  if (cfg) document.querySelectorAll('.scene:last-child mark.rn').forEach(e => demoFx.rough(e, parseFloat(e.style.getPropertyValue('--d')), cfg(e.getClientRects()[0].height)));
});
</script>
<script src="demo.js"></script>
